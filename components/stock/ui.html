<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>个股行情</title>
<link rel="stylesheet" href="../../assets/shared.css">
<style>
  /* 个股视图专属样式（基础样式见 shared.css） */
  .price { font-size: 32px; }
  .chg { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  canvas { height: 122px; min-height: 96px; }

  .stock-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 8px 0 2px;
    min-width: 0;
    flex-shrink: 0;
  }
  .stock-swiper { flex: 1; min-width: 0; overflow: hidden; }
  .stock-list {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    cursor: grab;
  }
  .stock-list::-webkit-scrollbar { display: none; }
  .stock-list:active { cursor: grabbing; }
  .stock-item {
    flex: 0 0 auto;
    background: rgba(255,255,255,.08);
    color: #c8cdd8;
    border: none;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
  }
  .stock-item:hover { background: rgba(255,255,255,.16); color: #e8ebf0; }
  .stock-item.active {
    background: rgba(255,255,255,.22);
    color: #fff;
    font-weight: 600;
  }
  .nav-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    background: rgba(255,255,255,.1);
    color: #e8ebf0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    line-height: 22px;
    text-align: center;
    padding: 0;
  }
  .nav-btn:hover { background: rgba(255,255,255,.22); }
  .stock-indicator {
    flex-shrink: 0;
    color: #aeb6c4;
    font-size: 10px;
    background: rgba(255,255,255,.08);
    padding: 2px 6px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .grid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    margin-top: 6px; gap: 2px 6px; font-size: 10px; text-align: center;
    flex-shrink: 0;
  }
  .grid .k { color: #6b7382; font-size: 9px; }
  .grid .v { color: #c8cdd8; font-variant-numeric: tabular-nums; }
  .grid .sub { color: #6b7382; font-size: 9px; height: 12px; line-height: 12px; white-space: nowrap; }
</style>
</head>
<body>
<div id="card">
  <div id="drag" class="header pywebview-drag-region">
    <span class="name"><b id="name">瑞芯微</b><span id="code">603893.SH</span></span>
    <span class="upd" id="upd">加载中…</span>
  </div>

  <div class="stock-nav">
    <button class="nav-btn" id="prevBtn" title="上一只">◀</button>
    <div class="stock-swiper" id="stockSwiper">
      <div class="stock-list" id="stockList"></div>
    </div>
    <button class="nav-btn" id="nextBtn" title="下一只">▶</button>
    <div class="stock-indicator" id="stockIndicator">1 / 10</div>
  </div>

  <div class="main">
    <span class="price flat" id="price">--</span>
    <span class="chg flat" id="chg">--</span>
    <span class="status" id="status"></span>
    <span class="vswitch">
      <span class="vs on" data-view="stock">个股</span>
      <span class="vs" data-view="group">组合</span>
    </span>
    <span class="tabs">
      <span class="tab on" id="tabMin">分时</span>
      <span class="tab" id="tabK">日K</span>
    </span>
  </div>

  <canvas id="chart"></canvas>

  <div class="grid">
    <div><div class="k">今开</div><div class="v" id="open">--</div></div>
    <div><div class="k">最高</div><div class="v" id="high">--</div></div>
    <div><div class="k">最低</div><div class="v" id="low">--</div></div>
    <div><div class="k">成交量</div><div class="v" id="vol">--</div><div class="sub" id="volRatio"></div></div>
    <div><div class="k">成交额</div><div class="v" id="amt">--</div></div>
    <div><div class="k">PE(TTM)</div><div class="v" id="peTtm">--</div></div>
    <div><div class="k">PE(动)</div><div class="v" id="peDyn">--</div></div>
    <div><div class="k">PE(静)</div><div class="v" id="peStat">--</div></div>
    <div><div class="k">市净率</div><div class="v" id="pb">--</div></div>
    <div><div class="k">总市值</div><div class="v" id="mcap">--</div></div>
  </div>
  <div class="rz rz-n" data-resize="n"></div>
  <div class="rz rz-s" data-resize="s"></div>
  <div class="rz rz-w" data-resize="w"></div>
  <div class="rz rz-e" data-resize="e"></div>
  <div class="rz rz-nw" data-resize="nw"></div>
  <div class="rz rz-ne" data-resize="ne"></div>
  <div class="rz rz-sw" data-resize="sw"></div>
  <div class="rz rz-se" data-resize="se" title="拖动调整窗口大小"><i></i></div>
</div>

<script src="../../assets/shared.js"></script>
<script>
/* 个股视图逻辑（工具函数见 shared.js） */
let minuteCache = null, minuteAt = 0, klineCache = null, mode = 'min';
let currentStockIndex = 0;
let stocks = [];
let lastRt = null;

const FALLBACK_STOCKS = [
  { code: "sh603893", name: "瑞芯微" },
  { code: "sh603986", name: "兆易创新" },
  { code: "sh688220", name: "翱捷科技-U" },
  { code: "sh688486", name: "龙迅股份" },
  { code: "sh688332", name: "中科蓝讯" },
  { code: "sh688018", name: "乐鑫科技" },
  { code: "sh688099", name: "晶晨股份" },
  { code: "sz300458", name: "全志科技" },
  { code: "sh688608", name: "恒玄科技" },
  { code: "sh688049", name: "炬芯科技" },
];

function renderStockList() {
  const list = $('stockList');
  list.innerHTML = stocks.map((s, i) =>
    `<button class="stock-item${i === currentStockIndex ? ' active' : ''}" data-index="${i}">${s.name}</button>`
  ).join('');
  $('stockIndicator').textContent = `${currentStockIndex + 1} / ${stocks.length}`;
}

function markActive() {
  $('stockList').querySelectorAll('.stock-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentStockIndex);
  });
  $('stockIndicator').textContent = `${currentStockIndex + 1} / ${stocks.length}`;
  scrollActiveIntoView();
}

function scrollActiveIntoView() {
  const item = $('stockList').querySelector('.stock-item.active');
  if (item) item.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}

function render(rt) {
  lastRt = rt || lastRt;
  if (!rt) {
    $('upd').textContent = HISTORY_REPLAY ? '该日期无行情快照与日K（当日未采集）' : '网络错误，重试中…';
    return;
  }

  $('name').textContent = rt.name || stocks[currentStockIndex]?.name || '--';
  $('code').textContent = fmtCode(stocks[currentStockIndex]?.code || rt.code);
  $('price').textContent = rt.price != null ? Number(rt.price).toFixed(2) : '--';
  const chg = rt.change != null ? ((rt.change > 0 ? '+' : '') + Number(rt.change).toFixed(2)) : '--';
  const pct = rt.change_pct != null ? ((rt.change_pct > 0 ? '+' : '') + Number(rt.change_pct).toFixed(2) + '%') : '';
  $('chg').textContent = pct ? `${chg}  ${pct}` : chg;
  $('price').className = 'price ' + cls(rt.change_pct || 0);
  $('chg').className = 'chg ' + cls(rt.change_pct || 0);
  // Number() 容错：2026-11-02 漏转窗口期入库的行情载荷 high/low 为字符串（见发布对照表 1.2.10）
  $('open').textContent = rt.open != null ? Number(rt.open).toFixed(2) : '--';
  $('high').textContent = rt.high != null ? Number(rt.high).toFixed(2) : '--';
  $('low').textContent = rt.low != null ? Number(rt.low).toFixed(2) : '--';
  $('vol').textContent = rt.volume != null ? (rt.volume / 10000).toFixed(1) + '万手' : '--';
  const ratio = rt.liang_ratio;
  $('volRatio').textContent = ratio != null ? `量比 ${ratio.toFixed(2)}` : '';
  $('volRatio').style.color = ratio == null ? '' : (ratio >= 2.5 ? '#ff5252' : (ratio >= 1.5 ? '#e6a23c' : ''));
  $('amt').textContent = rt.amount != null ? rt.amount.toFixed(2) + '亿' : '--';
  const pe = v => (v != null && v > 0) ? v.toFixed(1) : '--';
  $('peTtm').textContent = pe(rt.pe_ttm);
  $('peDyn').textContent = pe(rt.pe_dynamic);
  $('peStat').textContent = pe(rt.pe_static);
  $('pb').textContent = pe(rt.pb);
  $('mcap').textContent = rt.market_cap != null ? rt.market_cap.toFixed(0) + '亿' : '--';
  // 离线还原行情无成交额/估值字段（由日K与分时末点还原，见 data_source）
  const restored = HISTORY_REPLAY && rt.amount == null;
  $('upd').textContent = rt.time
    ? (restored ? `${rt.time.slice(4, 6)}-${rt.time.slice(6, 8)} 收盘 · 日K还原` : fmtTime(rt.time) + ' 更新')
    : '无时间数据';

  $('status').textContent = isTrading() ? '● 交易中' : '已收盘';
  document.title = `${rt.name || '--'} ${fmtCode(rt.code)}`;
}

/* 累计分时量 -> 单分钟量；任一点无量或累计值大幅回退（旧快照误存/数据损坏）
   返回 null，量柱整段不画，价格图占满全高。口径与 core/vol_calc 一致。 */
function volDeltas(points) {
  const vols = points.map(p => (typeof p.vol === 'number' && isFinite(p.vol)) ? p.vol : null);
  if (vols.some(v => v == null)) return null;
  let negative = 0;
  const deltas = vols.map((v, i) => {
    const d = v - (i ? vols[i - 1] : 0);
    if (d < 0) { negative += -d; return 0; }
    return d;
  });
  return negative > 0.01 * Math.max(vols[vols.length - 1], 0) ? null : deltas;
}

/* 量柱副图占下段约30%，与上段价格 x 轴对齐；无量时返回全高（不画副图） */
function volPaneSplit(h, hasVol) {
  const volH = hasVol ? Math.max(Math.round(h * 0.3), 24) : 0;
  return { priceH: h - volH, volH };
}

function volPaneSeparator(ctx, w, priceH) {
  ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, priceH + 1.5); ctx.lineTo(w, priceH + 1.5); ctx.stroke();
}

function drawChart(points, prevClose) {
  const { ctx, w, h } = setupCanvas();
  ctx.clearRect(0, 0, w, h);
  if (!points || points.length < 2) { drawChartMessage('暂无足够分时数据，稍后自动重试'); return; }
  const deltas = volDeltas(points);
  const priceH = volPaneSplit(h, !!deltas).priceH;
  const prices = points.map(p => p.price);
  let max = Math.max(...prices, prevClose), min = Math.min(...prices, prevClose);
  const pad = (max - min) * 0.1 || 0.1; max += pad; min -= pad;
  const N = 242;
  const x = i => 2 + i / (N - 1) * (w - 4);
  const y = p => 6 + (max - p) / (max - min) * (priceH - 12);

  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
  [0.25, 0.5, 0.75].forEach(f => {
    ctx.beginPath(); ctx.moveTo(0, priceH*f); ctx.lineTo(w, priceH*f); ctx.stroke();
  });
  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.setLineDash([3,3]); ctx.beginPath();
  ctx.moveTo(0, y(prevClose)); ctx.lineTo(w, y(prevClose)); ctx.stroke();
  ctx.setLineDash([]);

  const color = points[points.length-1].price >= prevClose ? '#ff5252' : '#26c281';
  ctx.beginPath();
  points.forEach((p, i) => {
    const px = x(Math.min(i, N-1));
    i ? ctx.lineTo(px, y(p.price)) : ctx.moveTo(px, y(p.price));
  });
  ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.lineTo(x(Math.min(points.length-1, N-1)), priceH); ctx.lineTo(x(0), priceH); ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, 0, priceH);
  g.addColorStop(0, color + '55'); g.addColorStop(1, color + '05');
  ctx.fillStyle = g; ctx.fill();

  if (!deltas) return;
  volPaneSeparator(ctx, w, priceH);
  const top = priceH + 3, bottom = h;
  const maxD = Math.max(...deltas) || 1;
  ctx.globalAlpha = .8;
  points.forEach((p, i) => {
    if (!deltas[i]) return;
    const up = i ? p.price >= points[i-1].price : p.price >= prevClose;
    ctx.fillStyle = up ? '#ff5252' : '#26c281';
    const bh = Math.max(1, deltas[i] / maxD * (bottom - top));
    ctx.fillRect(x(Math.min(i, N-1)) - 0.6, bottom - bh, 1.2, bh);
  });
  ctx.globalAlpha = 1;
}

function drawKline(bars) {
  const { ctx, w, h } = setupCanvas();
  ctx.clearRect(0, 0, w, h);
  if (!bars || bars.length < 2) { drawChartMessage('暂无足够日 K 数据，稍后自动重试'); return; }
  const vols = bars.map(b => (typeof b.vol === 'number' && isFinite(b.vol)) ? b.vol : null);
  const hasVol = vols.some(v => v != null);   // 旧库日K行无量：仅缺的日期不画柱
  const priceH = volPaneSplit(h, hasVol).priceH;
  let max = -1e9, min = 1e9;
  bars.forEach(b => { max = Math.max(max, b.high); min = Math.min(min, b.low); });
  const pad = (max - min) * 0.08 || 0.1; max += pad; min -= pad;
  const y = p => 6 + (max - p) / (max - min) * (priceH - 12);
  const slot = (w - 4) / bars.length, bw = Math.max(1.5, slot * 0.6);

  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
  [0.25, 0.5, 0.75].forEach(f => {
    ctx.beginPath(); ctx.moveTo(0, priceH*f); ctx.lineTo(w, priceH*f); ctx.stroke();
  });

  bars.forEach((b, i) => {
    const cx = 2 + slot * (i + 0.5);
    const up = b.close >= b.open;
    const color = up ? '#ff5252' : '#26c281';
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, y(b.high)); ctx.lineTo(cx, y(b.low)); ctx.stroke();
    const yo = y(b.open), yc = y(b.close);
    ctx.fillStyle = color;
    ctx.fillRect(cx - bw/2, Math.min(yo, yc), bw, Math.max(1, Math.abs(yc - yo)));
  });

  if (!hasVol) return;
  volPaneSeparator(ctx, w, priceH);
  const ma5 = vols.map((v, i) => {
    const win = vols.slice(Math.max(0, i - 4), i + 1);
    return (win.length === 5 && win.every(x => x != null))
      ? win.reduce((a, b) => a + b, 0) / 5 : null;
  });
  const maxV = Math.max(1, ...vols.filter(v => v != null), ...ma5.filter(v => v != null));
  const top = priceH + 12, bottom = h;   // 上留一行给图例
  bars.forEach((b, i) => {
    const v = vols[i]; if (v == null) return;
    ctx.fillStyle = (b.close >= b.open) ? 'rgba(255,82,82,.8)' : 'rgba(38,194,129,.8)';
    const bh = Math.max(1, v / maxV * (bottom - top));
    ctx.fillRect(2 + slot * i + (slot - bw) / 2, bottom - bh, bw, bh);
  });
  strokeSeries(ctx, ma5.map((v, i) => v == null ? null : [2 + slot * (i + 0.5), bottom - v / maxV * (bottom - top)]),
               'rgba(230,200,90,.9)', 1);
  ctx.fillStyle = 'rgba(230,200,90,.8)';
  ctx.font = '9px "Segoe UI", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('量柱 · 5日均量', 4, priceH + 10);
}

function redrawChart() {
  const prevClose = (lastRt && (lastRt.prev_close || lastRt.open)) || 0;
  if (mode === 'min' && minuteCache && lastRt) drawChart(minuteCache, prevClose);
  else if (mode === 'k' && klineCache) drawKline(klineCache);
  else drawChartMessage('图表数据加载中…');
}

async function refresh() {
  const py = api();
  if (!py) {
    $('upd').textContent = '等待连接…';
    return;
  }
  try {
    const rt = await py.get_realtime();
    render(rt);
    lastRt = rt;
    const prevClose = (rt && (rt.prev_close || rt.open)) || 0;
    if (mode === 'min') {
      if (!minuteCache?.length) drawChartMessage('分时数据加载中…');
      if (!minuteCache?.length || Date.now() - minuteAt > 60000) {
        minuteCache = await py.get_minute_data();
        minuteAt = Date.now();
      }
      let base = prevClose;
      if (minuteCache?.length && !base) base = await py.get_stock_prev_close?.() || 0;
      if (minuteCache?.length && base) drawChart(minuteCache, base);
      else if (!minuteCache?.length) drawChartMessage(HISTORY_REPLAY ? '该离线日期无当日分时（未采集，不可回补）'
                                           : '分时数据暂不可用，稍后自动重试');
      else drawChartMessage('无昨收基准，暂无法绘制分时');
    } else if (mode === 'k') {
      if (!klineCache?.length) {
        drawChartMessage('日 K 数据加载中…');
        klineCache = await py.get_kline();
      }
      if (klineCache) drawKline(klineCache);
      else drawChartMessage(HISTORY_REPLAY ? '该日期日K窗口不足（早于上市或长期停牌）'
                                           : '日 K 数据暂不可用，稍后自动重试');
    }
  } catch (e) {
    // 把真实异常显示出来（窗口版无控制台，报错必须看得见）；完整堆栈回传后台日志
    const detail = (e && (e.message || String(e))) || '未知错误';
    $('upd').textContent = '连接失败：' + detail;
    drawChartMessage('图表加载失败：' + detail);
    try { api()?.report_ui_error?.(String((e && e.stack) || e)); } catch (_) {}
  }
}

async function switchStock(index) {
  if (!stocks.length) return;
  currentStockIndex = (index + stocks.length) % stocks.length;
  minuteCache = null;
  klineCache = null;
  markActive();
  const s = stocks[currentStockIndex];
  if (s) {
    $('name').textContent = s.name;
    $('code').textContent = fmtCode(s.code);
    document.title = `${s.name} ${fmtCode(s.code)}`;
  }
  $('upd').textContent = '切换中…';
  const py = api();
  if (py && py.set_stock_index) {
    try { await py.set_stock_index(currentStockIndex); } catch (e) { console.error(e); }
  }
  await refresh();
}

function bindNav() {
  const list = $('stockList');
  $('prevBtn').onclick = () => switchStock(currentStockIndex - 1);
  $('nextBtn').onclick = () => switchStock(currentStockIndex + 1);
  list.addEventListener('click', e => {
    const btn = e.target.closest('.stock-item');
    if (!btn) return;
    switchStock(parseInt(btn.dataset.index, 10));
  });
  list.addEventListener('wheel', e => {
    e.preventDefault();
    list.scrollLeft += e.deltaY;
  }, { passive: false });

  $('tabMin').onclick = () => {
    mode = 'min';
    $('tabMin').classList.add('on');
    $('tabK').classList.remove('on');
    refresh();
  };
  $('tabK').onclick = () => {
    mode = 'k';
    $('tabK').classList.add('on');
    $('tabMin').classList.remove('on');
    refresh();
  };
}

async function init() {
  stocks = FALLBACK_STOCKS;
  const py = api();
  if (py && py.get_stocks) {
    try {
      const remote = await py.get_stocks();
      if (Array.isArray(remote) && remote.length) stocks = remote;
    } catch (e) { console.error(e); }
  }
  renderStockList();
  bindNav();
  bindViewSwitch();
  bindResize();
  await refresh();
  setInterval(refresh, 5000);
}

let started = false;
let HISTORY_REPLAY = false;   // 离线历史回放：缺失数据不可重试，提示语区分
document.addEventListener('DOMContentLoaded', () => {
  if (!started) { started = true; init(); }
});
whenBridgeReady(() => {
  api().get_stock_data_mode?.().then(m => { HISTORY_REPLAY = !!(m && m.mode === 'offline'); })
    .catch(() => {})
    .finally(() => {
      if (!started) { started = true; init(); }
      else refresh();
    });
});
</script>
</body>
</html>
