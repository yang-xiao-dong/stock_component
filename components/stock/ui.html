<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>个股行情</title>
<link rel="stylesheet" href="../../assets/shared.css">
<style>
  /* 个股视图专属样式（基础样式见 shared.css） */
  .price { font-size: 32px; }
  .chg { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  canvas { height: 92px; min-height: 80px; }

  .stock-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 8px 0 2px;
    min-width: 0;
    flex-shrink: 0;
  }
  .stock-swiper { flex: 1; min-width: 0; overflow: hidden; }
  .stock-list {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    cursor: grab;
  }
  .stock-list::-webkit-scrollbar { display: none; }
  .stock-list:active { cursor: grabbing; }
  .stock-item {
    flex: 0 0 auto;
    background: rgba(255,255,255,.08);
    color: #c8cdd8;
    border: none;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
  }
  .stock-item:hover { background: rgba(255,255,255,.16); color: #e8ebf0; }
  .stock-item.active {
    background: rgba(255,255,255,.22);
    color: #fff;
    font-weight: 600;
  }
  .nav-btn {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    background: rgba(255,255,255,.1);
    color: #e8ebf0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    line-height: 22px;
    text-align: center;
    padding: 0;
  }
  .nav-btn:hover { background: rgba(255,255,255,.22); }
  .stock-indicator {
    flex-shrink: 0;
    color: #aeb6c4;
    font-size: 10px;
    background: rgba(255,255,255,.08);
    padding: 2px 6px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .grid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    margin-top: 6px; gap: 2px 6px; font-size: 10px; text-align: center;
    flex-shrink: 0;
  }
  .grid .k { color: #6b7382; font-size: 9px; }
  .grid .v { color: #c8cdd8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="card">
  <div id="drag" class="header pywebview-drag-region">
    <span class="name"><b id="name">瑞芯微</b><span id="code">603893.SH</span></span>
    <span class="upd" id="upd">加载中…</span>
  </div>

  <div class="stock-nav">
    <button class="nav-btn" id="prevBtn" title="上一只">◀</button>
    <div class="stock-swiper" id="stockSwiper">
      <div class="stock-list" id="stockList"></div>
    </div>
    <button class="nav-btn" id="nextBtn" title="下一只">▶</button>
    <div class="stock-indicator" id="stockIndicator">1 / 10</div>
  </div>

  <div class="main">
    <span class="price flat" id="price">--</span>
    <span class="chg flat" id="chg">--</span>
    <span class="status" id="status"></span>
    <span class="vswitch">
      <span class="vs on" data-view="stock">个股</span>
      <span class="vs" data-view="group">组合</span>
    </span>
    <span class="tabs">
      <span class="tab on" id="tabMin">分时</span>
      <span class="tab" id="tabK">日K</span>
    </span>
  </div>

  <canvas id="chart"></canvas>

  <div class="grid">
    <div><div class="k">今开</div><div class="v" id="open">--</div></div>
    <div><div class="k">最高</div><div class="v" id="high">--</div></div>
    <div><div class="k">最低</div><div class="v" id="low">--</div></div>
    <div><div class="k">成交量</div><div class="v" id="vol">--</div></div>
    <div><div class="k">成交额</div><div class="v" id="amt">--</div></div>
  </div>
  <div class="rz rz-n" data-resize="n"></div>
  <div class="rz rz-s" data-resize="s"></div>
  <div class="rz rz-w" data-resize="w"></div>
  <div class="rz rz-e" data-resize="e"></div>
  <div class="rz rz-nw" data-resize="nw"></div>
  <div class="rz rz-ne" data-resize="ne"></div>
  <div class="rz rz-sw" data-resize="sw"></div>
  <div class="rz rz-se" data-resize="se" title="拖动调整窗口大小"><i></i></div>
</div>

<script src="../../assets/shared.js"></script>
<script>
/* 个股视图逻辑（工具函数见 shared.js） */
let minuteCache = null, minuteAt = 0, klineCache = null, mode = 'min';
let currentStockIndex = 0;
let stocks = [];
let lastRt = null;

const FALLBACK_STOCKS = [
  { code: "sh603893", name: "瑞芯微" },
  { code: "sh603986", name: "兆易创新" },
  { code: "sh688220", name: "翱捷科技-U" },
  { code: "sh688486", name: "龙迅股份" },
  { code: "sh688332", name: "中科蓝讯" },
  { code: "sh688018", name: "乐鑫科技" },
  { code: "sh688099", name: "晶晨股份" },
  { code: "sz300458", name: "全志科技" },
  { code: "sh688608", name: "恒玄科技" },
  { code: "sh688049", name: "炬芯科技" },
];

function renderStockList() {
  const list = $('stockList');
  list.innerHTML = stocks.map((s, i) =>
    `<button class="stock-item${i === currentStockIndex ? ' active' : ''}" data-index="${i}">${s.name}</button>`
  ).join('');
  $('stockIndicator').textContent = `${currentStockIndex + 1} / ${stocks.length}`;
}

function markActive() {
  $('stockList').querySelectorAll('.stock-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentStockIndex);
  });
  $('stockIndicator').textContent = `${currentStockIndex + 1} / ${stocks.length}`;
  scrollActiveIntoView();
}

function scrollActiveIntoView() {
  const item = $('stockList').querySelector('.stock-item.active');
  if (item) item.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}

function render(rt) {
  lastRt = rt || lastRt;
  if (!rt) {
    $('upd').textContent = '网络错误，重试中…';
    return;
  }

  $('name').textContent = rt.name || stocks[currentStockIndex]?.name || '--';
  $('code').textContent = fmtCode(stocks[currentStockIndex]?.code || rt.code);
  $('price').textContent = rt.price != null ? rt.price.toFixed(2) : '--';
  const chg = rt.change != null ? ((rt.change > 0 ? '+' : '') + rt.change.toFixed(2)) : '--';
  const pct = rt.change_pct != null ? ((rt.change_pct > 0 ? '+' : '') + rt.change_pct.toFixed(2) + '%') : '';
  $('chg').textContent = pct ? `${chg}  ${pct}` : chg;
  $('price').className = 'price ' + cls(rt.change_pct || 0);
  $('chg').className = 'chg ' + cls(rt.change_pct || 0);
  $('open').textContent = rt.open != null ? rt.open.toFixed(2) : '--';
  $('high').textContent = rt.high != null ? rt.high.toFixed(2) : '--';
  $('low').textContent = rt.low != null ? rt.low.toFixed(2) : '--';
  $('vol').textContent = rt.volume != null ? (rt.volume / 10000).toFixed(1) + '万手' : '--';
  $('amt').textContent = rt.amount != null ? rt.amount.toFixed(2) + '亿' : '--';
  $('upd').textContent = rt.time ? fmtTime(rt.time) + ' 更新' : '无时间数据';

  $('status').textContent = isTrading() ? '● 交易中' : '已收盘';
  document.title = `${rt.name || '--'} ${fmtCode(rt.code)}`;
}

function drawChart(points, prevClose) {
  const { ctx, w, h } = setupCanvas();
  ctx.clearRect(0, 0, w, h);
  if (!points || points.length < 2) return;
  const prices = points.map(p => p.price);
  let max = Math.max(...prices, prevClose), min = Math.min(...prices, prevClose);
  const pad = (max - min) * 0.1 || 0.1; max += pad; min -= pad;
  const N = 242;
  const x = i => 2 + i / (N - 1) * (w - 4);
  const y = p => 6 + (max - p) / (max - min) * (h - 12);

  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
  [0.25, 0.5, 0.75].forEach(f => {
    ctx.beginPath(); ctx.moveTo(0, h*f); ctx.lineTo(w, h*f); ctx.stroke();
  });
  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.setLineDash([3,3]); ctx.beginPath();
  ctx.moveTo(0, y(prevClose)); ctx.lineTo(w, y(prevClose)); ctx.stroke();
  ctx.setLineDash([]);

  const color = points[points.length-1].price >= prevClose ? '#ff5252' : '#26c281';
  ctx.beginPath();
  points.forEach((p, i) => {
    const px = x(Math.min(i, N-1));
    i ? ctx.lineTo(px, y(p.price)) : ctx.moveTo(px, y(p.price));
  });
  ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.lineTo(x(Math.min(points.length-1, N-1)), h); ctx.lineTo(x(0), h); ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, color + '55'); g.addColorStop(1, color + '05');
  ctx.fillStyle = g; ctx.fill();
}

function drawKline(bars) {
  const { ctx, w, h } = setupCanvas();
  ctx.clearRect(0, 0, w, h);
  if (!bars || bars.length < 2) return;
  let max = -1e9, min = 1e9;
  bars.forEach(b => { max = Math.max(max, b.high); min = Math.min(min, b.low); });
  const pad = (max - min) * 0.08 || 0.1; max += pad; min -= pad;
  const y = p => 6 + (max - p) / (max - min) * (h - 12);
  const slot = (w - 4) / bars.length, bw = Math.max(1.5, slot * 0.6);

  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
  [0.25, 0.5, 0.75].forEach(f => {
    ctx.beginPath(); ctx.moveTo(0, h*f); ctx.lineTo(w, h*f); ctx.stroke();
  });

  bars.forEach((b, i) => {
    const cx = 2 + slot * (i + 0.5);
    const up = b.close >= b.open;
    const color = up ? '#ff5252' : '#26c281';
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, y(b.high)); ctx.lineTo(cx, y(b.low)); ctx.stroke();
    const yo = y(b.open), yc = y(b.close);
    ctx.fillStyle = color;
    ctx.fillRect(cx - bw/2, Math.min(yo, yc), bw, Math.max(1, Math.abs(yc - yo)));
  });
}

function redrawChart() {
  const prevClose = (lastRt && (lastRt.prev_close || lastRt.open)) || 0;
  if (mode === 'min' && minuteCache && lastRt) drawChart(minuteCache, prevClose);
  else if (mode === 'k' && klineCache) drawKline(klineCache);
  else setupCanvas();
}

async function refresh() {
  const py = api();
  if (!py) {
    $('upd').textContent = '等待连接…';
    return;
  }
  try {
    const rt = await py.get_realtime();
    render(rt);
    if (rt && (!minuteCache || Date.now() - minuteAt > 60000)) {
      minuteCache = await py.get_minute_data();
      minuteAt = Date.now();
    }
    if (!klineCache) klineCache = await py.get_kline();
    lastRt = rt;
    const prevClose = (rt && (rt.prev_close || rt.open)) || 0;
    if (mode === 'min') {
      if (minuteCache && rt) drawChart(minuteCache, prevClose);
      else setupCanvas();
    } else if (mode === 'k') {
      if (klineCache) drawKline(klineCache);
      else setupCanvas();
    }
  } catch (e) {
    $('upd').textContent = '连接失败…';
    console.error('Refresh error:', e);
  }
}

async function switchStock(index) {
  if (!stocks.length) return;
  currentStockIndex = (index + stocks.length) % stocks.length;
  minuteCache = null;
  klineCache = null;
  markActive();
  const s = stocks[currentStockIndex];
  if (s) {
    $('name').textContent = s.name;
    $('code').textContent = fmtCode(s.code);
    document.title = `${s.name} ${fmtCode(s.code)}`;
  }
  $('upd').textContent = '切换中…';
  const py = api();
  if (py && py.set_stock_index) {
    try { await py.set_stock_index(currentStockIndex); } catch (e) { console.error(e); }
  }
  await refresh();
}

function bindNav() {
  const list = $('stockList');
  $('prevBtn').onclick = () => switchStock(currentStockIndex - 1);
  $('nextBtn').onclick = () => switchStock(currentStockIndex + 1);
  list.addEventListener('click', e => {
    const btn = e.target.closest('.stock-item');
    if (!btn) return;
    switchStock(parseInt(btn.dataset.index, 10));
  });
  list.addEventListener('wheel', e => {
    e.preventDefault();
    list.scrollLeft += e.deltaY;
  }, { passive: false });

  $('tabMin').onclick = () => {
    mode = 'min';
    $('tabMin').classList.add('on');
    $('tabK').classList.remove('on');
    refresh();
  };
  $('tabK').onclick = () => {
    mode = 'k';
    $('tabK').classList.add('on');
    $('tabMin').classList.remove('on');
    refresh();
  };
}

async function init() {
  stocks = FALLBACK_STOCKS;
  const py = api();
  if (py && py.get_stocks) {
    try {
      const remote = await py.get_stocks();
      if (Array.isArray(remote) && remote.length) stocks = remote;
    } catch (e) { console.error(e); }
  }
  renderStockList();
  bindNav();
  bindViewSwitch();
  bindResize();
  await refresh();
  setInterval(refresh, 5000);
}

let started = false;
document.addEventListener('DOMContentLoaded', () => {
  if (!started) { started = true; init(); }
});
window.addEventListener('pywebviewready', () => {
  if (!started) { started = true; init(); }
  else refresh();
});
</script>
</body>
</html>
