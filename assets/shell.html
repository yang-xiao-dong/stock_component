<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>股票小组件</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* 外壳：上下堆叠组件卡片，整体可滚动 */
  html, body { height: 100%; }
  body {
    padding: 8px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.15) transparent;
  }
  body::-webkit-scrollbar { width: 5px; }
  body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgb(24,26,34);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 8px;
    min-height: 26px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .tb-title { font-size: 11px; font-weight: 600; color: #aeb6c4; cursor: move; }
  .tb-tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .tb-btn { font-size: 10px; color: #aeb6c4; background: rgba(255,255,255,.08);
            padding: 1px 7px; border-radius: 6px; cursor: pointer; border: 0; font-family: inherit; }
  .tb-btn:hover { background: rgba(255,255,255,.18); color: #e8ebf0; }
  .window-tools { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
  .window-btn { border: 0; width: 26px; height: 24px; padding: 0;
                font: 16px/1 "Segoe UI", sans-serif; }
  .window-btn:disabled { opacity: .4; cursor: default; }
  .window-btn:focus-visible { outline: 1px solid #aeb6c4; outline-offset: 1px; }
  #closeWindow:hover { background: #c42b3a; color: #fff; }
  .tb-badge { font-size: 9px; color: #ffd54f; background: rgba(255,213,79,.15);
              padding: 1px 6px; border-radius: 6px; }
  .tb-select { font-size: 10px; background: rgba(24,26,34,.95); color: #dfe3ea;
               border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
               padding: 0 2px; height: 17px; }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .slot { border: 0; width: 100%; display: block; }
  .layout-panel { flex-basis: 100%; padding: 8px; border: 1px solid rgba(255,255,255,.12);
                  border-radius: 8px; color: #c8cdd8; font-size: 11px; }
  .layout-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .layout-list { list-style: none; margin-top: 6px; max-height: 180px; overflow-y: auto; }
  .layout-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
  .layout-label { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layout-number { width: 16px; color: #8892a6; text-align: center; }
  .order-btn { width: 27px; height: 24px; padding: 0; font-size: 14px; }
  .layout-panel button:disabled { opacity: .35; cursor: default; }
  .layout-panel button:focus-visible, #layoutToggle:focus-visible { outline: 1px solid #aeb6c4; outline-offset: 1px; }
  .layout-status { color: #8892a6; font-size: 10px; margin-top: 5px; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="tb-title">{{APP_TITLE}}</span>
    <span class="tb-tools">
      <button type="button" class="tb-btn" id="layoutToggle" aria-expanded="false" aria-controls="layoutPanel">排序</button>
      <span class="tb-badge" id="modeBadge" style="display:none">离线</span>
      <select class="tb-select" id="snapDate" style="display:none" title="选择快照日期"></select>
      <span class="tb-btn" id="modeToggle" title="切换 在线/离线快照">离线</span>
      <span class="tb-btn" id="saveSnap" title="抓取当前整组数据保存为快照">存快照</span>
    </span>
    <span class="window-tools">
      <button type="button" class="tb-btn window-btn" id="minimizeWindow"
              title="最小化到任务栏" aria-label="最小化窗口" disabled>−</button>
      <button type="button" class="tb-btn window-btn" id="closeWindow"
              title="关闭股票小组件" aria-label="关闭窗口" disabled>×</button>
    </span>
    <section class="layout-panel" id="layoutPanel" aria-label="组件排序" hidden>
      <div class="layout-head"><span>组件显示顺序</span><button type="button" class="tb-btn" id="resetOrder" disabled>恢复默认</button></div>
      <ol class="layout-list" id="layoutList"></ol>
      <p class="layout-status" id="layoutStatus" role="status">使用上下箭头调整，自动保存。</p>
    </section>
  </div>
  <div class="stack"><!-- COMPONENT SLOTS --></div>

  <!-- 窗口级缩放手柄（组件卡片内的手柄在嵌入模式下已隐藏） -->
  <div class="rz rz-n" data-resize="n"></div>
  <div class="rz rz-s" data-resize="s"></div>
  <div class="rz rz-w" data-resize="w"></div>
  <div class="rz rz-e" data-resize="e"></div>
  <div class="rz rz-nw" data-resize="nw"></div>
  <div class="rz rz-ne" data-resize="ne"></div>
  <div class="rz rz-sw" data-resize="sw"></div>
  <div class="rz rz-se" data-resize="se" title="拖动调整窗口大小"><i></i></div>

  <script src="shared.js"></script>
  <script>
    bindResize();
    // 仅调整 CSS 排列；不移动 iframe 节点，保留组件当前状态。
    const componentSlots = Array.from(document.querySelectorAll('.slot[data-component-id]'));
    const defaultOrder = componentSlots.map(frame => frame.dataset.componentId);
    let componentOrder = [...componentSlots].sort((a, b) => Number(a.style.order) - Number(b.style.order))
      .map(frame => frame.dataset.componentId);
    let orderReady = false, orderSaving = false;

    function renderOrderControls() {
      const list = document.getElementById('layoutList');
      list.replaceChildren();
      componentOrder.forEach((id, index) => {
        const frame = componentSlots.find(item => item.dataset.componentId === id);
        const row = document.createElement('li');
        row.className = 'layout-row'; row.dataset.componentId = id;
        const number = document.createElement('span');
        number.className = 'layout-number'; number.textContent = index + 1;
        const label = document.createElement('span');
        label.className = 'layout-label'; label.textContent = frame.title;
        row.append(number, label);
        [-1, 1].forEach(direction => {
          const button = document.createElement('button');
          button.type = 'button'; button.className = 'tb-btn order-btn';
          button.textContent = direction < 0 ? '↑' : '↓';
          button.dataset.direction = direction;
          button.title = `${direction < 0 ? '上移' : '下移'}${frame.title}`;
          button.setAttribute('aria-label', button.title);
          button.disabled = !orderReady || orderSaving || index + direction < 0 || index + direction >= componentOrder.length;
          button.addEventListener('click', () => {
            const next = [...componentOrder];
            [next[index], next[index + direction]] = [next[index + direction], next[index]];
            saveComponentOrder(next, {id, direction});
          });
          row.append(button);
        });
        list.append(row);
      });
      document.getElementById('resetOrder').disabled = !orderReady || orderSaving ||
        componentOrder.every((id, index) => id === defaultOrder[index]);
    }

    async function saveComponentOrder(next, focus) {
      if (!orderReady || orderSaving) return;
      orderSaving = true;
      renderOrderControls();
      const status = document.getElementById('layoutStatus');
      status.textContent = '正在保存…';
      try {
        if (!await api().set_component_order(next)) throw new Error('排序保存失败');
        componentOrder = next;
        componentSlots.forEach(frame => { frame.style.order = componentOrder.indexOf(frame.dataset.componentId); });
        status.textContent = '顺序已保存，重启后仍保留。';
      } catch (error) {
        console.error(error);
        status.textContent = '保存失败，顺序未更改，请重试。';
      } finally {
        orderSaving = false;
        renderOrderControls();
        if (focus) {
          const row = Array.from(document.querySelectorAll('.layout-row')).find(item => item.dataset.componentId === focus.id);
          const preferred = row?.querySelector(`[data-direction="${focus.direction}"]`);
          (preferred && !preferred.disabled ? preferred : row?.querySelector('button:not(:disabled)'))?.focus();
        }
      }
    }

    document.getElementById('layoutToggle').addEventListener('click', () => {
      const panel = document.getElementById('layoutPanel');
      panel.hidden = !panel.hidden;
      document.getElementById('layoutToggle').setAttribute('aria-expanded', String(!panel.hidden));
    });
    document.getElementById('resetOrder').addEventListener('click', () => saveComponentOrder([...defaultOrder]));
    renderOrderControls();
    whenBridgeReady(() => {
      orderReady = typeof api().set_component_order === 'function';
      renderOrderControls();
    });
    [
      ['minimizeWindow', 'minimize_window', '最小化到任务栏'],
      ['closeWindow', 'close_window', '关闭股票小组件'],
    ].forEach(([id, method, title]) => {
      const btn = document.getElementById(id);
      whenBridgeReady(() => { btn.disabled = typeof api()[method] !== 'function'; });
      btn.addEventListener('click', async () => {
        const py = api();
        if (!py || typeof py[method] !== 'function') return;
        try {
          btn.title = await py[method]() ? title : '操作失败，请重试';
        } catch (e) { console.error(e); btn.title = '操作失败，请重试'; }
      });
    });
    // 窗口移动（程序化）：标题文字 + 组件卡片之间的空隙（顶栏按钮区不参与拖动）
    // pointermove 逐步 move_to；pointer capture 保证拖出窗口边界不丢事件
    document.querySelectorAll('.tb-title, .stack').forEach(el => {
      el.addEventListener('pointerdown', async e => {
        if (e.button !== 0) return;
        const py = api();
        if (!py || !py.get_window_pos || !py.move_to) return;
        e.preventDefault();
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
        const p0 = await py.get_window_pos();
        if (!p0 || p0.x == null) return;
        const cx = e.clientX, cy = e.clientY;
        const move = ev => { py.move_to(p0.x + ev.clientX - cx, p0.y + ev.clientY - cy); };
        const up = ev => {
          el.removeEventListener('pointermove', move);
          el.removeEventListener('pointerup', up);
          try { el.releasePointerCapture(ev.pointerId); } catch (_) {}
        };
        el.addEventListener('pointermove', move);
        el.addEventListener('pointerup', up);
      });
    });

    // ---------- 数据模式：在线 / 离线快照 ----------
    function reloadSlots() {
      document.querySelectorAll('.slot').forEach(f => {
        try { f.contentWindow.location.reload(); }
        catch (_) { const s = f.src; f.src = s; }
      });
    }

    function flashBtn(id, msg, ms) {
      const b = document.getElementById(id);
      const t = b.textContent;
      b.textContent = msg;
      setTimeout(() => { b.textContent = t; }, ms || 2000);
    }

    async function initDataMode() {
      const py = api();
      if (!py || !py.get_data_mode) return;
      try {
        const snaps = await py.list_snapshots();
        const mode = await py.get_data_mode();
        const sel = document.getElementById('snapDate');
        sel.innerHTML = snaps.map(d => `<option value="${d}">${d}</option>`).join('');
        const offline = mode.mode === 'offline';
        sel.style.display = offline ? '' : 'none';
        if (offline && mode.date) sel.value = mode.date;
        document.getElementById('modeToggle').textContent = offline ? '回到在线' : '离线';
        const badge = document.getElementById('modeBadge');
        badge.style.display = offline ? '' : 'none';
        badge.textContent = `离线 ${mode.date || ''}`;
        document.getElementById('saveSnap').style.display = offline ? 'none' : '';
      } catch (e) { console.error(e); }
    }

    document.getElementById('modeToggle').addEventListener('click', async () => {
      const py = api(); if (!py) return;
      try {
        const mode = await py.get_data_mode();
        if (mode.mode === 'offline') {
          if (await py.set_data_mode('live')) { reloadSlots(); initDataMode(); }
        } else {
          const snaps = await py.list_snapshots();
          if (!snaps.length) { flashBtn('modeToggle', '无快照'); return; }
          const date = document.getElementById('snapDate').value || snaps[snaps.length - 1];
          if (await py.set_data_mode('offline', date)) { reloadSlots(); initDataMode(); }
        }
      } catch (e) { console.error(e); }
    });

    document.getElementById('snapDate').addEventListener('change', async () => {
      const py = api(); if (!py) return;
      try {
        if (await py.set_data_mode('offline', document.getElementById('snapDate').value)) {
          reloadSlots(); initDataMode();
        }
      } catch (e) { console.error(e); }
    });

    document.getElementById('saveSnap').addEventListener('click', async () => {
      const py = api(); if (!py) return;
      const btn = document.getElementById('saveSnap');
      btn.textContent = '保存中…';
      try {
        const r = await py.capture_snapshot();
        btn.textContent = r.ok ? `已存 ${r.date}` : '保存失败';
        if (r.ok) await initDataMode();
      } catch (e) { console.error(e); btn.textContent = '保存失败'; }
      setTimeout(() => { btn.textContent = '存快照'; }, 2500);
    });

    whenBridgeReady(initDataMode);
  </script>
</body>
</html>
